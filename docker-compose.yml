services:
  postgres:
    image: postgres:16-alpine
    container_name: harkkalogi-postgres
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
